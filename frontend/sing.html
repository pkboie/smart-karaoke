<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>演唱 · Smart Karaoke</title>
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<header>
  <span class="brand">Smart Karaoke</span>
  <a class="text-link" href="./">← 返回選歌</a>
</header>

<main>
  <h1 id="song-title" class="page-heading">演唱</h1>
  <div class="controls sing-controls">
    <fieldset id="difficulty" class="difficulty">
      <legend>難度</legend>
      <label><input type="radio" name="difficulty" value="100" checked><span>簡單 <small>±100 cent</small></span></label>
      <label><input type="radio" name="difficulty" value="50"><span>困難 <small>±50 cent</small></span></label>
    </fieldset>
    <label>延遲補償 <input id="latency" type="number" value="0" step="1" min="0" max="1000"> ms</label>
    <button id="calibrate-latency" type="button">延遲校正（喇叭測試）</button>
    <small id="latency-status" role="status">聲學回錄為粗估；耳機配置需另外驗證。</small>
    <label>演唱標籤（選填） <input id="trace-label" type="text" size="15" placeholder="例如 小明_偏高"></label>
    <button id="start" type="button" disabled>開始唱</button>
    <button id="stop" type="button" disabled>結束並評分</button>
  </div>

  <div id="lyrics" class="lyrics" hidden>
    <p id="lyric"></p>
    <p id="next-lyric"></p>
  </div>
  <div class="status">
    <span id="live">即時命中率 0%</span>
  </div>
  <canvas id="canvas" width="1200" height="360"></canvas>
  <div class="progress"><div id="bar"></div></div>
  <p id="msg" role="status"></p>
  <p class="hint">請戴耳機，避免麥克風收到伴奏。第一次使用時瀏覽器會詢問麥克風權限。</p>
</main>

<audio id="audio" preload="auto"></audio>
<script type="module" src="main.js?v=8"></script>
</body>
</html>
